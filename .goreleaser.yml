version: 2

project_name: hackerfive

builds:
  - id: hackerfive
    main: ./cmd/hackerfive
    binary: hackerfive
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # windows/arm64 isn't one of the 5 platforms doc10 targets
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Setting `files` replaces goreleaser's default LICENSE*/README* globs
    # entirely (not additive), so both are re-listed here alongside
    # templates/ — a standalone binary with no repo checkout needs its own
    # copy of templates/ or --templates falls back to an empty directory
    # (see docs/21-scanning-real-targets.md and README's Installation section).
    files:
      - LICENSE*
      - README*
      - src: templates/**/*
        dst: templates

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Generic, reusable starting point — NOT tied to any specific target. Edit
# variables.base_path (and the ID range/param name, if needed) before use:
# this covers the common REST convention of a numeric ID as a query
# parameter, e.g. /api/orders?id=42 (crapi-mechanic-report.yaml in this same
# directory is a real, live-verified example of exactly this shape).
id: generic-idor-query-param
info:
  name: Generic IDOR — numeric ID as a query parameter
  author: HackerFive
  severity: high
  description: >
    Template starting point for baseline-mode IDOR against an endpoint whose
    resource ID is a query parameter. Requires HACKERFIVE_AUTH_TOKEN and
    HACKERFIVE_OTHER_AUTH_TOKEN (or --auth-token/--other-auth-token).
tags:
  - idor
variables:
  base_path: /api/CHANGE-ME
requests:
  - path: "{{BaseURL}}{{base_path}}?id={{RangeInt(1|100)}}"

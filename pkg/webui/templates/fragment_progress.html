{{define "fragment_progress"}}<span class="status-badge{{if .Phase}} phase-badge{{end}}">{{.Status}}{{if .Phase}}: {{.Phase}}{{end}}</span>{{if .Err}} <span class="error">{{.Err}}</span>{{end}}
{{if .Waves}}<ul class="wave-list">{{range .Waves}}<li>{{.Name}}: <span class="status-badge">{{.Status}}</span></li>{{end}}</ul>{{end}}
{{end}}

{{define "new_scan.html"}}{{template "header" .}}
<h1>New Scan</h1>

{{if .Errors}}<div class="error"><ul>{{range .Errors}}<li>{{.}}</li>{{end}}</ul></div>{{end}}

<form hx-post="/scans" hx-target="#scan-panel" hx-push-url="true">
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

<fieldset>
<legend>Target &amp; Detector</legend>
<label for="targets">Target(s) — one per line</label>
<textarea id="targets" name="targets" required>{{.Targets}}</textarea>

<label for="detector">Detector</label>
<select id="detector" name="detector" hx-get="/scans/new/detector-fields" hx-target="#detector-fields" hx-trigger="change" hx-include="this">
<option value="misconfig" {{if eq .Detector "misconfig"}}selected{{end}}>misconfig — no auth token needed, safe first check</option>
<option value="idor" {{if eq .Detector "idor"}}selected{{end}}>idor</option>
<option value="authbypass" {{if eq .Detector "authbypass"}}selected{{end}}>authbypass</option>
</select>

{{.DetectorFieldsHTML}}

<label for="tags">Template tags (--tags, comma-separated, optional)</label>
<input type="text" id="tags" name="tags" value="{{.Tags}}">
</fieldset>

<fieldset>
<legend>Authentication</legend>
<label for="auth_token">Auth token (--auth-token)</label>
<input type="password" id="auth_token" name="auth_token" value="{{.AuthToken}}">
<label for="other_auth_token">Other auth token (--other-auth-token, optional)</label>
<input type="password" id="other_auth_token" name="other_auth_token" value="{{.OtherAuthToken}}">
<label for="auth_header_name">Auth header name (--auth-header-name, optional)</label>
<input type="text" id="auth_header_name" name="auth_header_name" value="{{.AuthHeaderName}}" placeholder="Authorization">
<label for="auth_header_format">Auth header format (--auth-header-format, optional, must contain {token})</label>
<input type="text" id="auth_header_format" name="auth_header_format" value="{{.AuthHeaderFormat}}" placeholder="Bearer {token}">
<label for="headers">Extra headers (--header, one &quot;Name: Value&quot; per line, optional)</label>
<textarea id="headers" name="headers" placeholder="Cookie: PHPSESSID=...">{{.Headers}}</textarea>
</fieldset>

<fieldset>
<legend>Scan behavior</legend>
<label for="rate_limit">Rate limit (--rate-limit, req/s)</label>
<input type="number" id="rate_limit" name="rate_limit" value="{{.RateLimit}}" min="1">
<label for="concurrency">Concurrency (--concurrency)</label>
<input type="number" id="concurrency" name="concurrency" value="{{.Concurrency}}" min="1">
<label for="proxy">Proxy (--proxy, optional)</label>
<input type="text" id="proxy" name="proxy" value="{{.Proxy}}" placeholder="http://127.0.0.1:8080">
<label for="timeout">Per-request timeout (--timeout, e.g. 30s)</label>
<input type="text" id="timeout" name="timeout" value="{{.Timeout}}">
<label class="inline"><input type="checkbox" id="insecure" name="insecure" {{if .Insecure}}checked{{end}}> Skip TLS verification (--insecure) — lab targets only</label>
<label for="scope_file">Scope file (--scope, path on this machine, optional)</label>
<input type="text" id="scope_file" name="scope_file" value="{{.ScopeFile}}">
</fieldset>

<fieldset>
<legend>Authorization</legend>
<label class="inline"><input type="checkbox" name="authorized" required> I am authorized to scan this target</label>
</fieldset>

<button type="submit">Start Scan</button>
</form>
<div id="scan-panel"></div>
{{template "footer" .}}
{{end}}

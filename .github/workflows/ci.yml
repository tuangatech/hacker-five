name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.26.5'
      - run: go test -v -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - run: golangci-lint run
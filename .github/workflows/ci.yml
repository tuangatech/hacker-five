name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # ubuntu-latest stands in for WSL2's linux/amd64 runtime
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned explicitly: golangci-lint-action@v6's unpinned default
          # resolved to golangci-lint v1.64.8 (built with Go 1.24) on the
          # macOS runner, which then refused to run — "the Go language
          # version (go1.24) used to build golangci-lint is lower than the
          # targeted Go version (1.26.5)" (go.mod's go directive). v2.13.1
          # is current stable as of 2026-08-26 (github.com/golangci/golangci-lint/releases)
          # and is built with a Go version new enough for this module.
          version: v2.13.1
      - name: Coverage gate
        run: |
          # -coverpkg=./... is required: every test lives in tests/unit (an
          # external test package), so plain `go test -coverprofile` only
          # attributes coverage to whichever package contains the test file,
          # not the packages it imports — reporting a misleading 0.0% total.
          # See docs/10-implementation-plan-ph1b.md Step 4 for how this was found.
          go test -coverpkg=./... -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Total coverage: ${total}%"
          # Gated at the real achieved number (see doc10 Step 4), not a
          # blind target — raise this as real coverage grows, don't lower it.
          awk -v t="$total" 'BEGIN { exit (t+0 < 79.0) }'
